name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-south-1

jobs:

  terraform-apply:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # AWS
      # --------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/EC2-SSM-Spoke-Role
          aws-region: ap-south-1

      # --------------------------------------------------
      # Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------
      # Check GitHub variables
      # --------------------------------------------------

     
      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="hub_vpc_cidr=${{ vars.HUB_VPC_CIDR }}" \
            -var="transit_gateway_id=${{ vars.TRANSIT_GATEWAY_ID }}" \
            -var="hub_test_ip=${{ vars.HUB_TEST_IP }}" \
            -var="hub_test_port=80" \
            -out=tfplan

      # --------------------------------------------------
      # Verify Plan
      # --------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Checking tfplan..."

          if [ ! -f tfplan ]; then
            echo "ERROR: tfplan was not created"
            exit 1
          fi

          echo "tfplan exists"
          ls -lh tfplan

      # --------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan
